; docker/supervisord.conf
; ═══════════════════════════════════════════════════════════════
; Manages PostgreSQL + Django/Uvicorn in a single container
; ═══════════════════════════════════════════════════════════════

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─── PostgreSQL ───────────────────────────────────────────────
[program:postgresql]
command=/usr/local/bin/pg_entrypoint.sh
user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Django / Uvicorn ─────────────────────────────────────────
[program:django]
command=bash -c "python /app/wait_for_postgres.py && python /app/manage.py migrate && exec uvicorn algo_trading.asgi:application --host ${BIND_ADDRESS:-127.0.0.1} --port ${BIND_PORT:-8000} --workers ${UVICORN_WORKERS:-1} --ws websockets --backlog ${UVICORN_BACKLOG:-128} --timeout-keep-alive 65 --access-log"
directory=/app
user=root
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Nginx ────────────────────────────────────────────────────
[program:nginx]
command=bash -c 'CERT=$(ls /etc/letsencrypt/live/*/fullchain.pem 2>/dev/null | head -n 1); KEY=$(ls /etc/letsencrypt/live/*/privkey.pem 2>/dev/null | head -n 1); if [ -n "$CERT" ] && [ -n "$KEY" ]; then sed -i "s|ssl_certificate .*|ssl_certificate $CERT;|" /etc/nginx/nginx.conf; sed -i "s|ssl_certificate_key .*|ssl_certificate_key $KEY;|" /etc/nginx/nginx.conf; else sed -i "s|ssl_certificate .*|ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;|" /etc/nginx/nginx.conf; sed -i "s|ssl_certificate_key .*|ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;|" /etc/nginx/nginx.conf; fi; exec nginx -g "daemon off;"'
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── WebSocket Engine ──────────────────────────────────────────
[program:ws_engine]
command=bash -c "python /app/wait_for_postgres.py && exec python /app/manage.py run_ws_engine"
directory=/app
user=root
autostart=true
autorestart=true
priority=25
startsecs=1
startretries=10
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Django Q2 Worker ──────────────────────────────────────────
[program:django_q]
command=bash -c "python /app/wait_for_postgres.py && exec python /app/manage.py qcluster"
directory=/app
user=root
autostart=true
autorestart=true
priority=25
startsecs=5
startretries=10
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Django Algo Engine ──────────────────────────────────────────
[program:algo_engine]
command=bash -c "python /app/wait_for_postgres.py && exec python /app/manage.py run_algo_engine"
directory=/app
user=root
autostart=true
autorestart=true
priority=25
startsecs=5
startretries=10
stopsignal=SIGTERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

